# Render Blueprint: public sandbox demo (no KULT World connection, no secrets).
# The signing key is generated on the disk at first start; PUBLIC_ORIGIN
# defaults to Render's RENDER_EXTERNAL_URL.
services:
  - type: web
    name: kult-syndicates
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: syndicates-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SYNDICATES_DEMO
        value: "yes"
