# Include inside the HTTPS server block for your KULT World host.
# Preserve the prefix: proxy_pass intentionally has no trailing slash.
location = /world/syndicates {
    return 308 /world/syndicates/$is_args$args;
}
location /world/syndicates/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}
